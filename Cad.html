<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">


    <title>iHelp — Criar minha conta</title>


    <link
        rel="stylesheet"
        href="Cad.css"
    >

    <script
        src="Cad.js"
        defer
    ></script>
</head>

<body>

    <main class="container">

        <section class="card">

            <h2 class="destaque">
                Criar minha conta
            </h2>

            <section
                class="erros"
                id="erros"
                role="alert"
                hidden
            >
                <p>Cadastro não realizado:</p>
                <menu id="erros-lista"></menu>
            </section>

            <form
                action="index.html"
                method="get"
                id="form-cadastro"
                novalidate
            >

                <fieldset>

                    <legend>
                        Dados do cadastro
                    </legend>

                    <label for="nome">
                        Nome:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        aria-describedby="nome-msg"
                    >
                    <small
                        class="campo__msg"
                        id="nome-msg"
                    ></small>

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        aria-describedby="email-msg"
                    >
                    <small
                        class="campo__msg"
                        id="email-msg"
                    ></small>

                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        aria-describedby="nascimento-msg"
                    >
                    <small
                        class="campo__msg"
                        id="nascimento-msg"
                    ></small>

                    <div class="acoes">

                        <button type="submit">
                            Cadastrar
                        </button>

                        <button
                            type="reset"
                            class="secundario"
                        >
                            Limpar
                        </button>

                        <a
                            href="PaginaInicio.html"
                            class="secundario"
                        >
                            Voltar
                        </a>

                    </div>

                </fieldset>

            </form>

        </section>

    </main>

    <footer class="rodape">

        <div class="rodape__marca">
            <p class="nome_site">iHelp</p>
            <p>Cuidado e apoio, de mãos dadas.</p>
        </div>

        <div class="rodape__links">
            <a href="PaginaInicio.html">Sobre</a>
            <a href="PaginaInicio.html">Saúde</a>
            <a href="PaginaInicio.html">Doação</a>
        </div>

        <p class="rodape__copy">© 2026 iHelp. Todos os direitos reservados.</p>

    </footer>

</body>

</html>
