<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">


    <title>iHelp — Criar minha conta</title>


    <link
        rel="stylesheet"
        href="Cad.css"
    >
</head>

<body>

    <main class="container">

        <section class="card">

            <h2 class="destaque">
                Criar minha conta
            </h2>

            <form action="index.html" method="get">

                <fieldset>

                    <legend>
                        Dados do cadastro
                    </legend>

                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                    <div class="acoes">

                        <button type="submit">
                            Cadastrar
                        </button>

                        <button
                            type="reset"
                            class="secundario"
                        >
                            Limpar
                        </button>

                        <a
                            href="PaginaInicio.html"
                            class="secundario"
                        >
                            Voltar
                        </a>

                    </div>

                </fieldset>

            </form>

        </section>

    </main>

    <footer class="rodape">

        <div class="rodape__marca">
            <p class="nome_site">iHelp</p>
            <p>Cuidado e apoio, de mãos dadas.</p>
        </div>

        <div class="rodape__links">
            <a href="PaginaInicio.html">Sobre</a>
            <a href="PaginaInicio.html">Saúde</a>
            <a href="PaginaInicio.html">Doação</a>
        </div>

        <p class="rodape__copy">© 2026 iHelp. Todos os direitos reservados.</p>

    </footer>

</body>

</html>
